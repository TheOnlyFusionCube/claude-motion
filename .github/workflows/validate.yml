name: Validate skill

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Upstream integrity and unit tests
        run: npm run check
      - name: Render check of the example film
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/check.mjs examples/launch
