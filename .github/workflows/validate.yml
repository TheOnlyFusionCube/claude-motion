name: Validate skill

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and FFmpeg
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Doctor
        run: node scripts/doctor.mjs
      - name: Upstream integrity and tests (runtime, synth, in-browser renders)
        run: npm run check
      - name: Render checks
        run: |
          node scripts/check.mjs templates/starter
          node scripts/check.mjs examples/styles
      - name: Draft export
        run: node scripts/export.mjs templates/starter --draft --out /tmp/starter.mp4
