<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Claude Motion - Example Film</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="app" class="app">
    <div class="topline"><span class="mark" aria-hidden="true"></span><span>CLAUDE MOTION / EXAMPLE</span><span class="topline-right">A FILM FROM CODE</span></div>
    <section class="viewer" aria-label="Film preview">
      <canvas id="film" width="1920" height="1080" role="img" aria-label="Animated visual demonstration of a time-seekable motion graphic"></canvas>
    </section>
    <section class="transport" aria-label="Playback controls">
      <button id="toggle" type="button" aria-label="Play film">Play</button>
      <input id="seek" type="range" min="0" max="14" step="0.001" value="0" aria-label="Film position in seconds" />
      <output id="clock" for="seek">00:00 / 00:14</output>
    </section>
    <p class="hint">Edit <code>src/scenes.mjs</code> to design your film. Every frame depends only on time, so scrubbing and export agree.</p>
  </main>
  <script>
    if (new URLSearchParams(location.search).get('capture') === '1') document.body.classList.add('capture');
  </script>
  <script type="module" src="./src/main.mjs"></script>
</body>
</html>
